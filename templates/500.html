{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="container" style="padding: 80px 20px; text-align: center; max-width: 600px;">
    <div style="font-size: 5rem; font-weight: 800; color: #fca5a5; line-height: 1; margin-bottom: 12px;">500</div>
    <h1 style="font-size: 1.8rem; font-weight: 800; color: #0f172a; margin-bottom: 12px;">
        Internal Server Error
    </h1>
    <p style="color: #64748b; font-size: 1rem; margin-bottom: 24px;">
        {{ error_message or "An unexpected issue occurred while processing your request. Please try again." }}
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">
        <i class="fa-solid fa-house"></i> Return to Homepage
    </a>
</div>
{% endblock %}
