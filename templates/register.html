{% extends "base.html" %}

{% block title %}Create Account - Travel Planner{% endblock %}

{% block content %}
<div class="container" style="padding-top: 50px; max-width: 480px;">
    <div class="form-card" style="padding: 36px 32px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <div class="logo-icon" style="margin: 0 auto 12px; width: 48px; height: 48px; font-size: 1.4rem;">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 style="font-size: 1.7rem; font-weight: 800; color: #0f172a; margin-bottom: 6px;">Create Account</h1>
            <p style="color: #64748b; font-size: 0.9rem;">Join Travel Planner to customize your travel profiles.</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="username">Username:</label>
                <input type="text" name="username" id="username" class="form-input" required placeholder="Choose a username" value="{{ username or '' }}">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email (Optional):</label>
                <input type="email" name="email" id="email" class="form-input" placeholder="name@example.com" value="{{ email or '' }}">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password:</label>
                <input type="password" name="password" id="password" class="form-input" required placeholder="Minimum 4 characters">
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm Password:</label>
                <input type="password" name="confirm_password" id="confirm_password" class="form-input" required placeholder="Repeat password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">
                <i class="fa-solid fa-check"></i> Register Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: #64748b;">
            Already have an account? <a href="{{ url_for('auth.login') }}" style="font-weight: 700;">Sign In</a>
            &bull; <a href="{{ url_for('auth.guest_login') }}">Continue as Guest</a>
        </div>
    </div>
</div>
{% endblock %}
